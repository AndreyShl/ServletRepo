<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список книг</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .back-link {
            text-align: center;
            margin: 20px;
        }

        .back-link a {
            text-decoration: none;
            color: #007BFF;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Список книг</h1>


    <table>

        <tbody>

            <tr>
                <td>Title1</td>
                <td>Tom Hansk</td>
                <td>2001</td>
            </tr>
            <tr>
                <td>Title2</td>
                <td>Gen Berry</td>
                <td>2010</td>
            </tr>
            <tr>
                <td>Title3</td>
                <td>Adam</td>
                <td>2003</td>
            </tr>
            <tr>
                <td>title4</td>
                <td>Kavalsky</td>
                <td>2021</td>
            </tr>

        </tbody>
    </table>

    <div class="back-link">
        <a href="/WebInterpriceTest/main">main page</a>
    </div>
</body>
</html>
